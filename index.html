<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Words to ASCII | ASCII Numbers & Character Table</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-container">
    <!-- Header -->
    <header class="app-header">
      <h1 class="app-title">Words to ASCII</h1>
      <p class="app-subtitle">Interactive ASCII numerical converter and standard ASCII character reference</p>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Section 1: ASCII Numbers -->
      <section class="card" id="section-numbers">
        <h2 class="card-title">ASCII Numbers</h2>

        <div class="input-container">
          <label for="text-input" class="input-label">Enter Text</label>
          <textarea id="text-input" class="text-input" rows="3" placeholder="Enter text here...">Hello World</textarea>
          
          <div class="input-metadata">
            <span id="stat-chars">Characters: 11</span>
            <span class="meta-dot">&bull;</span>
            <span id="stat-words">Words: 2</span>
            <span class="meta-dot">&bull;</span>
            <span id="stat-bytes">Bytes: 11 B</span>
          </div>
        </div>

        <div class="table-wrapper">
          <table class="ascii-table">
            <thead>
              <tr>
                <th>Character</th>
                <th>Decimal</th>
                <th>Hex</th>
                <th>Binary</th>
                <th>Octal</th>
              </tr>
            </thead>
            <tbody id="numbers-tbody">
              <!-- Populated dynamically -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Section 2: ASCII Table -->
      <section class="card" id="section-table">
        <h2 class="card-title">ASCII Table</h2>

        <div class="table-wrapper scrollable-table-wrapper">
          <table class="ascii-table">
            <thead>
              <tr>
                <th>Decimal</th>
                <th>Hex</th>
                <th>Character</th>
                <th>Binary</th>
                <th>Octal</th>
              </tr>
            </thead>
            <tbody id="reference-tbody">
              <!-- Standard ASCII 0-127 populated dynamically -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Words to ASCII &bull; Created by <a href="https://github.com/Samiksha-1312" target="_blank" rel="noopener">Samiksha Kalekar</a></p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
